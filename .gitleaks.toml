title = "ClairFLE — détection de secrets"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Deux identifiants publics exacts de scènes TCF, reliés aux PNG et empreintes vérifiés dans le rapport du 15 novembre."
condition = "AND"
paths = ['''(^|/)docs/tcf/corrections-interlocuteurs-20261115\.json$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"(?:dialogue-b1-travail-invitation-deux-interlocuteurs|dialogue-b1-elsa-projet-sortie-deux-interlocuteurs)"?$''']

[[rules.allowlists]]
description = "Empreintes SHA-256 de vocabulaires de modèles audio dans les six rapports de reconnaissance vérifiés (ADR 0019)."
condition = "AND"
paths = ['''(^|/)docs/tcf/remplacement-audio/(?:bascule-preuves-reconnaissances-20261105|correction-debut-allo-brigitte-20261112|adjudications-contextuelles-20261112|corrections-4-editions-20261111|verification-numero-radio-cinema-20261112|validation-87-20261111)\.json$''']
regexTarget = "match"
regexes = ['''^(?:(?:small|medium)-)?tokens\.txt"\s*:\s*"[0-9a-f]{64}"?$''']

[[rules.allowlists]]
description = "Empreinte du vocabulaire Whisper small dans les deux relectures DELF vérifiées, identique aux rapports déjà contrôlés."
condition = "AND"
paths = ['''(^|/)docs/tcf/delf-actif-20261113/relectures/(?:signature-52-1-d7caa132e648|signature-52-2-caaca983b5dd)\.json$''']
regexTarget = "match"
regexes = ['''^small-tokens\.txt"\s*:\s*"[0-9a-f]{64}"?$''']

[[rules.allowlists]]
description = "Identifiants publics exacts de dix scènes TCF, reliés à leurs images et empreintes vérifiées dans les trois rapports du 14 novembre."
condition = "AND"
paths = [
  '''(^|/)docs/tcf/correction\-interlocuteurs\-pluie\-20261114\.json$''',
  '''(^|/)docs/tcf/generation\-scenarios\-b1\-complement\-20261114\.json$''',
  '''(^|/)docs/tcf/generation\-scenarios\-priorite\-20261114\.json$''',
]
regexTarget = "match"
regexes = ['''^key"\s*:\s*"(?:scene\-b1\-deborde\-travail|scene\-b1\-elsa\-rendezvous|scene\-b1\-pluie\-deux\-interlocuteurs|scene\-prio\-a2\-claudine\-interro|scene\-prio\-a2\-decoration\-mere|scene\-prio\-a2\-horaires\-cadeaux|scene\-prio\-a2\-pere\-refus\-bowling|scene\-prio\-a2\-remerciements\-iles|scene\-prio\-a2\-vendeur\-coton|scene\-prio\-a2\-voiture\-pere)"?$''' ]

[[rules.allowlists]]
description = "Quatre identifiants publics exacts des dernières scènes B1, reliés aux PNG et empreintes vérifiés le 15 novembre."
condition = "AND"
paths = ['''(^|/)docs/tcf/generation-scenarios-b1-final-20261115\.json$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"(?:scenario\-b1\-choix\-plats\-trois\-interlocuteurs|scenario\-b1\-expliquer\-exercice\-non\-fait|scenario\-b1\-discuter\-loisirs\-citoyens|scenario\-b1\-appel\-choix\-cadeau\-patrick)"?$''']

[[rules.allowlists]]
description = "Référence exacte à une question publique DELF, reliée à la banque et au MP3 vérifiés le 16 novembre."
condition = "AND"
paths = ['''(^|/)docs/tcf/delf-actif-20261113/images-a-preparer\.json$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"tcf-delf-actif-a2-043-03-01#6"?$''']

[[rules.allowlists]]
description = "Référence publique exacte de la question 6 de l’invitation DELF A1, vérifiée dans la banque et son document illustré."
condition = "AND"
paths = ['''(^|/)docs/tcf/plan-images-contextuel-20261106\.json$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"delf\-a1\-2022\-ce\-ex1\-invitation\#6"?$''']

[[rules.allowlists]]
description = "Référence publique exacte de la question 2 du nouvel élève, vérifiée dans la banque TCF et son MP3 le 17 novembre."
condition = "AND"
paths = ['''(^|/)docs/tcf/preparation-433-trios-20261112\.json$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"tcf-ssx-a2-ecole-nouvel-eleve-co-4#2"?$''']

[[rules.allowlists]]
description = "37 alias publics exacts d’images TCF, reliés aux banques et fichiers vérifiés le 22 novembre. Les clés aléatoires restent détectées."
condition = "AND"
paths = [
  '''(^|/)docs/tcf/cinema\-athletisme\-documents\-20261121\.json$''',
  '''(^|/)docs/tcf/revue\-actions\-fetes\-athletisme\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-duos\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-etages\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-lieux\-rdv\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-rayons\-lieux\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-trio\-objets\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-trios\-sacs\-aliments\-20261120\.json$''',
  '''(^|/)docs/tcf/revue\-trios\-sports\-metaux\-trains\-20261120\.json$''',
  '''(^|/)docs/tcf/trios\-cadeaux\-loisirs\-20261121\.json$''',
]
regexTarget = "match"
regexes = ['''^key"\s*:\s*"(?:21\-cinema\-debout|21\-hauteur\-deux\-pieds|qcm\-20261120\-bonbons\-gateaux|qcm\-20261120\-chips\-biscuits\-sales|qcm\-20261120\-duo\-foot\-basket|qcm\-20261120\-duo\-livres\-poemes|qcm\-20261120\-duo\-natation\-velo|qcm\-20261120\-duo\-tennis\-natation|qcm\-20261120\-duo\-tennis\-rugby|qcm\-20261120\-equipement\-natation|qcm\-20261120\-equipement\-ski|qcm\-20261120\-equipement\-tennis|qcm\-20261120\-etage\-1\-aligne|qcm\-20261120\-etage\-2\-aligne|qcm\-20261120\-etage\-3\-aligne|qcm\-20261120\-gare\-routiere|qcm\-20261120\-glacier\-italien|qcm\-20261120\-gymnase\-facade|qcm\-20261120\-magasin\-chaussures\-enfants|qcm\-20261120\-magasin\-danse|qcm\-20261120\-pendentif\-eiffel\-cuivre|qcm\-20261120\-pendentif\-eiffel\-or|qcm\-20261120\-piscine\-facade|qcm\-20261120\-rayon\-bibliotheque\-bleu|qcm\-20261120\-rayon\-bibliotheque\-vert|qcm\-20261120\-sacs\-voyage|qcm\-20261120\-train\-tgv|tcf\-athle\-hauteur\-20261120|tcf\-athle\-longueur\-20261120|tcf\-athle\-poids\-20261120|tcf\-cadeaux\-loisirs\-bon\-20261121|tcf\-cadeaux\-loisirs\-chansons\-20261121|tcf\-cinema\-asseoir\-20261120|tcf\-cinema\-lever\-20261120|tcf\-cinema\-sortir\-20261120|trio\-objets\-20261120\-cahier\-regle|trio\-objets\-20261120\-livre\-ordinateur)"?$''']

[[rules.allowlists]]
description = "Empreintes exactes du lot DELF, reliées aux PNG publics vérifiés les 23 et 24 novembre. Le mot papier déclenche le détecteur API. Valeurs aléatoires toujours détectées."
condition = "AND"
paths = ['''(^|/)docs/tcf/delf-actif-20261113/lot2-100-20261123-preparation\.json$''']
regexTarget = "secret"
regexes = ['''^4644a20fa86f5e0f218779af5100506f86c5a6ca8437145d562c3a645cb24ffd$''', '''^7237320b96f4ea98569a9e701e86c9b7e609e727521eaede172cbbf15f71870e$''', '''^f3b9e39b5edc06f5f4253d8383a940a1a007449b1ae6574b2d43e8bbc4199776$''']
