title = "ClairFLE — détection de secrets"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Empreintes SHA-256 de vocabulaires de modèles audio dans les six rapports de reconnaissance vérifiés (ADR 0019)."
condition = "AND"
paths = ['''(^|/)docs/tcf/remplacement-audio/(?:bascule-preuves-reconnaissances-20261105|correction-debut-allo-brigitte-20261112|adjudications-contextuelles-20261112|corrections-4-editions-20261111|verification-numero-radio-cinema-20261112|validation-87-20261111)\.json$''']
regexTarget = "match"
regexes = ['''^(?:(?:small|medium)-)?tokens\.txt"\s*:\s*"[0-9a-f]{64}"?$''']

[[rules.allowlists]]
description = "Empreinte du vocabulaire Whisper small dans les deux relectures DELF vérifiées, identique aux rapports déjà contrôlés."
condition = "AND"
paths = ['''(^|/)docs/tcf/delf-actif-20261113/relectures/(?:signature-52-1-d7caa132e648|signature-52-2-caaca983b5dd)\.json$''']
regexTarget = "match"
regexes = ['''^small-tokens\.txt"\s*:\s*"[0-9a-f]{64}"?$''']
