name: Qualité ClairFLE interactif

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/fiches/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix api/fiches --no-audit --no-fund
      - name: Secrets dans les modifications (sortie masquée)
        run: npm run check:interactive:secrets
      - run: npm run lint
      - run: npx tsc -b
      - run: npx tsc -b api/fiches/tsconfig.json
      - run: npm test
      - run: npx vite build --manifest
      - run: npm run check:interactive:budgets
      - run: npx playwright install --with-deps chromium
      - name: Parcours, accessibilité et non-régression A4
        run: npm run test:interactive:all
      - name: Résultats et captures de test
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clairfle-interactive-results
          path: |
            docs/interactive/*-results.json
            docs/interactive/screenshots/*.png
            docs/tcm-csc/*-results.json
            docs/tcm-csc/screenshots/*.png
            docs/tcm-csc/*.pdf
            docs/tcf/*-results.json
            docs/tcf/screenshots/*.png
            docs/tcf/*.pdf
          retention-days: 7
