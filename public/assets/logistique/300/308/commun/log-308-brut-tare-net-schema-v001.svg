<svg xmlns="http://www.w3.org/2000/svg" width="770" height="215" viewBox="0 0 770 215" role="img" aria-labelledby="titre description">
  <title id="titre">Obtenir la masse nette à partir de la masse brute</title>
  <desc id="description">Le colis plein pèse 6,5 kg. Son emballage vide pèse 0,7 kg. La masse des marchandises est de 5,8 kg.</desc>
  <rect width="770" height="215" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round">
    <path d="M95 65h90v58H95zm0 0 17-16h57l16 16m-45 0v17"/>
    <path d="M340 82h90v41h-90zm0 0-14-20h90l14 20m-90 0 14-20"/>
    <circle cx="609" cy="105" r="15"/>
    <circle cx="632" cy="83" r="15"/>
    <circle cx="658" cy="105" r="15"/>
  </g>
  <g fill="#222" font-family="sans-serif" text-anchor="middle">
    <text x="385" y="30" font-size="25" font-weight="700">Du colis plein à la marchandise seule</text>
    <text x="262" y="104" font-size="32">−</text>
    <text x="509" y="104" font-size="32">=</text>
    <text x="140" y="158" font-size="22">Masse brute</text>
    <text x="385" y="158" font-size="22">Tare</text>
    <text x="632" y="158" font-size="22">Masse nette</text>
    <text x="140" y="192" font-size="23" font-weight="700">6,5 kg</text>
    <text x="385" y="192" font-size="23" font-weight="700">0,7 kg</text>
    <text x="632" y="192" font-size="23" font-weight="700">5,8 kg</text>
  </g>
</svg>
