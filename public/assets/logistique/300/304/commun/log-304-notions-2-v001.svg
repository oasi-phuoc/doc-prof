    <text x="141.333" y="105" font-size="19" font-weight="bold">Décrire</text>
    <text x="141.333" y="128" font-size="16">Dossier et constat</text>
    <text x="141.333" y="144" font-size="16">factuel</text>
    <path d="M262.667 110h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
