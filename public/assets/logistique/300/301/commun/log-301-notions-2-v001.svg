<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Les deux options de coût</title>
  <desc id="info">Faire. Matière, travail et capacité. Acheter. Prix, transport et contrôle.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Les deux options de coût</text>
    <rect x="26" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="206" y="78" font-size="16">A</text>
    <text x="206" y="105" font-size="19" font-weight="bold">Faire</text>
    <text x="206" y="128" font-size="16">Matière, travail et capacité</text>
    <rect x="414" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="594" y="78" font-size="16">B</text>
    <text x="594" y="105" font-size="19" font-weight="bold">Acheter</text>
    <text x="594" y="128" font-size="16">Prix, transport et contrôle</text>
  </g>
</svg>
