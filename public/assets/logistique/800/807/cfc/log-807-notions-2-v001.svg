  <title id="titre">Transition ou animation</title>
  <desc id="info">Le passage de la diapositive 1 à la diapositive 2 est une transition. Dans la deuxième diapositive, une flèche montre l&#x27;apparition d&#x27;un graphique, qui est une animation.</desc>
