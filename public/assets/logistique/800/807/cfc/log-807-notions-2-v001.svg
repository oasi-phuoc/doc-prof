  <g font-family="sans-serif" fill="#202020">
    <text x="400" y="30" text-anchor="middle" font-size="25" font-weight="bold">Transition ou animation</text>
<rect x="68" y="69" width="235" height="118" rx="4" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
    <rect x="497" y="69" width="235" height="118" rx="4" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
    <path d="M309 121h179m-9-7 9 7-9 7 M102 128h145m-145 12h123m-123 12h98 M530 99h157" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M612 156h105m-100 0v-15m24 15v-25m25 25v-37m25 37v-29 M540 142h67m-7-6 7 6-7 6" fill="none" stroke="#444" stroke-width="3"/>
