<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-labelledby="title desc">
  <title id="title">Fusion et fractionnement de cellules</title>
  <desc id="desc">Le tableau de gauche a deux cellules d’en-tête distinctes. Dans le tableau de droite, un même titre occupe toute la première ligne. Les cellules des données restent séparées.</desc>
  <rect width="800" height="210" fill="white"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M70 83h268v88H70zm0 31h268m0 29H70M204 83v88"/>
    <path d="M462 83h268v88H462zm0 31h268m0 29H462M596 114v57"/>
    <path d="M367 126h66m-9-7 9 7-9 7"/>
  </g>
  <g fill="#222" font-family="sans-serif" text-anchor="middle">
    <text x="400" y="32" font-size="25" font-weight="bold">Fusion et fractionnement de cellules</text>
    <text x="204" y="65" font-size="19" font-weight="bold">Deux cellules d’en-tête</text>
    <text x="596" y="65" font-size="19" font-weight="bold">Titre commun</text>
    <text x="137" y="105" font-size="16">Article</text>
    <text x="271" y="105" font-size="16">Quantité</text>
    <text x="596" y="105" font-size="16">Réception</text>
    <text x="137" y="135" font-size="16">A14</text>
    <text x="271" y="135" font-size="16">24</text>
    <text x="529" y="135" font-size="16">A14</text>
    <text x="663" y="135" font-size="16">24</text>
  </g>
</svg>
