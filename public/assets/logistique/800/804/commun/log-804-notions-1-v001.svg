<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Remettre un travail de cours</title>
  <desc id="info">Consulter. Classe, consigne et échéance. Joindre. Ouvrir et vérifier le fichier. Remettre. Contrôler la confirmation.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Remettre un travail de cours</text>
    <rect x="26" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="141.333" y="78" font-size="16">1</text>
    <text x="141.333" y="105" font-size="19" font-weight="bold">Consulter</text>
    <text x="141.333" y="128" font-size="16">Classe, consigne et</text>
    <text x="141.333" y="144" font-size="16">échéance</text>
    <path d="M262.667 110h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="284.667" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="400" y="78" font-size="16">2</text>
    <text x="400" y="105" font-size="19" font-weight="bold">Joindre</text>
    <text x="400" y="128" font-size="16">Ouvrir et vérifier le</text>
    <text x="400" y="144" font-size="16">fichier</text>
    <path d="M521.333 110h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="543.333" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="658.667" y="78" font-size="16">3</text>
    <text x="658.667" y="105" font-size="19" font-weight="bold">Remettre</text>
    <text x="658.667" y="128" font-size="16">Contrôler la confirmation</text>
  </g>
</svg>
