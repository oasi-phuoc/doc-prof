<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Définir la bonne surface de référence</title>
  <desc id="info">Brute. Ensemble du périmètre. Nette. Après exclusions.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Définir la bonne surface de référence</text>
    <rect x="26" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="206" y="78" font-size="16">A</text>
    <text x="206" y="105" font-size="19" font-weight="bold">Brute</text>
    <text x="206" y="128" font-size="16">Ensemble du périmètre</text>
    <rect x="414" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="594" y="78" font-size="16">B</text>
    <text x="594" y="105" font-size="19" font-weight="bold">Nette</text>
    <text x="594" y="128" font-size="16">Après exclusions</text>
  </g>
</svg>
