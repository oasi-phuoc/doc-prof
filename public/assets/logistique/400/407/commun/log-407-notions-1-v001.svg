<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Comparer le mouvement et le parcours</title>
  <desc id="info">Moyen mobile. Parcours variables autorisés. Moyen fixe. Trajet défini par l’installation.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Comparer le mouvement et le parcours</text>
    <rect x="26" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="206" y="78" font-size="16">A</text>
    <text x="206" y="105" font-size="19" font-weight="bold">Moyen mobile</text>
    <text x="206" y="128" font-size="16">Parcours variables autorisés</text>
    <rect x="414" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="594" y="78" font-size="16">B</text>
    <text x="594" y="105" font-size="19" font-weight="bold">Moyen fixe</text>
    <text x="594" y="128" font-size="16">Trajet défini par l’installation</text>
  </g>
</svg>
