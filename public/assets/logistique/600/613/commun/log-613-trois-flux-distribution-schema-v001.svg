<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="titre description">
  <title id="titre">Les trois flux d’une commande en ligne</title>
  <desc id="description">Les marchandises vont du vendeur au client. Les informations circulent dans les deux sens. Pour une vente sans remboursement, le paiement va du client au vendeur.</desc>
  <rect width="800" height="270" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="19" y="102" width="137" height="55" rx="5"/>
    <rect x="644" y="102" width="137" height="55" rx="5"/>
    <path d="M175 75h450m-11-9 11 9-11 9"/>
    <path d="M175 135h450m-11-9 11 9-11 9m-428-18-11 9 11 9" stroke-dasharray="8 5"/>
    <path d="M175 195h450m-439-9-11 9 11 9"/>
  </g>
  <g fill="#222" font-family="sans-serif" font-size="23" text-anchor="middle">
    <text x="400" y="31" font-weight="700">Les trois flux d’une commande en ligne</text>
    <text x="87" y="137">Vendeur</text>
    <text x="712" y="137">Client</text>
    <text x="400" y="65">Marchandises : envoi du colis</text>
    <text x="400" y="125">Informations : commande et suivi</text>
    <text x="400" y="185">Argent : paiement</text>
    <text x="400" y="237" font-size="19">Le transporteur et le prestataire de paiement peuvent intervenir.</text>
  </g>
</svg>
