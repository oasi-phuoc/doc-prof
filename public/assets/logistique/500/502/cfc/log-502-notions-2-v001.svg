<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Séparer les sorties du processus</title>
  <desc id="info">Conforme. Transfert vers l’aval. Écart. Contrôle ou filière désignée.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Séparer les sorties du processus</text>
    <rect x="26" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="206" y="78" font-size="16">A</text>
    <text x="206" y="105" font-size="19" font-weight="bold">Conforme</text>
    <text x="206" y="128" font-size="16">Transfert vers l’aval</text>
    <rect x="414" y="50" width="360" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="594" y="78" font-size="16">B</text>
    <text x="594" y="105" font-size="19" font-weight="bold">Écart</text>
    <text x="594" y="128" font-size="16">Contrôle ou filière désignée</text>
  </g>
</svg>
