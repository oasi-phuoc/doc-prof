<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Choisir selon volume et variété</title>
  <desc id="info">Unitaire. Faible volume et besoin précis. Par lots. Séries alternées. Masse. Volume élevé et répétable.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Choisir selon volume et variété</text>
    <rect x="26" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="141.333" y="78" font-size="16">A</text>
    <text x="141.333" y="105" font-size="19" font-weight="bold">Unitaire</text>
    <text x="141.333" y="128" font-size="16">Faible volume et besoin</text>
    <text x="141.333" y="144" font-size="16">précis</text>
    <rect x="284.667" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="400" y="78" font-size="16">B</text>
    <text x="400" y="105" font-size="19" font-weight="bold">Par lots</text>
    <text x="400" y="128" font-size="16">Séries alternées</text>
    <rect x="543.333" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="658.667" y="78" font-size="16">C</text>
    <text x="658.667" y="105" font-size="19" font-weight="bold">Masse</text>
    <text x="658.667" y="128" font-size="16">Volume élevé et répétable</text>
  </g>
</svg>
