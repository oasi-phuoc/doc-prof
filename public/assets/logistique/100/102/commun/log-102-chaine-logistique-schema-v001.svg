<svg xmlns="http://www.w3.org/2000/svg" width="800" height="255" viewBox="0 0 800 255" role="img" aria-labelledby="titre description">
  <title id="titre">Les quatre domaines de la chaîne logistique</title>
  <desc id="description">De gauche à droite, approvisionnement, production, distribution et élimination. Les flux de marchandises circulent d’une étape à l’autre. Les informations remontent et redescendent entre les partenaires.</desc>
  <rect width="800" height="255" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="67" width="175" height="54" rx="5"/>
    <rect x="211" y="67" width="175" height="54" rx="5"/>
    <rect x="413" y="67" width="175" height="54" rx="5"/>
    <rect x="615" y="67" width="175" height="54" rx="5"/>
    <path d="M190 94h15m-6-6 6 6-6 6m193-6h15m-6-6 6 6-6 6m193-6h15m-6-6 6 6-6 6"/>
    <path d="M97 162h606m-7-6 7 6-7 6m-593-12-6 6 6 6" stroke-dasharray="5 4"/>
  </g>
  <g fill="#222" font-family="sans-serif" text-anchor="middle">
    <text x="400" y="36" font-size="28" font-weight="700">Les quatre domaines de la chaîne logistique</text>
    <text x="97" y="101" font-size="20">Approvisionnement</text>
    <text x="298" y="101" font-size="22">Production</text>
    <text x="500" y="101" font-size="22">Distribution</text>
    <text x="702" y="101" font-size="22">Élimination</text>
    <text x="400" y="193" font-size="22">Informations dans les deux sens</text>
    <text x="400" y="234" font-size="20">Entre les domaines : transport, transbordement et stockage (TTS).</text>
  </g>
</svg>
