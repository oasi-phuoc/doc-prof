<svg xmlns="http://www.w3.org/2000/svg" width="780" height="270" viewBox="0 0 780 270" role="img" aria-labelledby="titre description">
  <title id="titre">Les six conditions des 6B</title>
  <desc id="description">La livraison doit respecter la marchandise, la quantité, la qualité, le moment, l’endroit et le prix convenus.</desc>
  <rect width="780" height="270" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2.5">
    <rect x="18" y="62" width="234" height="65" rx="5"/><rect x="273" y="62" width="234" height="65" rx="5"/><rect x="528" y="62" width="234" height="65" rx="5"/>
    <rect x="18" y="146" width="234" height="65" rx="5"/><rect x="273" y="146" width="234" height="65" rx="5"/><rect x="528" y="146" width="234" height="65" rx="5"/>
  </g>
  <g fill="#222" font-family="sans-serif" font-size="23" text-anchor="middle">
    <text x="390" y="34" font-size="29" font-weight="700">Les 6B d’une livraison</text>
    <text x="135" y="103">Bonne marchandise</text><text x="390" y="103">Bonne quantité</text><text x="645" y="103">Bonne qualité</text>
    <text x="135" y="187">Bon moment</text><text x="390" y="187">Bon endroit</text><text x="645" y="187">Bon prix</text>
    <text x="390" y="246" font-size="20">Contrôlez les six conditions dans un même dossier.</text>
  </g>
</svg>
