<svg xmlns="http://www.w3.org/2000/svg" width="790" height="250" viewBox="0 0 790 250" role="img" aria-labelledby="titre description">
  <title id="titre">Deux flux de marchandises avec ou sans transformation</title>
  <desc id="description">Un négoce reçoit, stocke puis expédie le même produit. Un atelier reçoit des composants, les assemble puis expédie le produit assemblé.</desc>
  <rect width="790" height="250" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="63" width="224" height="55" rx="5"/><rect x="283" y="63" width="224" height="55" rx="5"/><rect x="550" y="63" width="224" height="55" rx="5"/>
    <rect x="16" y="171" width="224" height="55" rx="5"/><rect x="283" y="171" width="224" height="55" rx="5"/><rect x="550" y="171" width="224" height="55" rx="5"/>
    <path d="M247 90h30m-7-7 7 7-7 7m244-7h30m-7-7 7 7-7 7M247 198h30m-7-7 7 7-7 7m244-7h30m-7-7 7 7-7 7"/>
  </g>
  <g fill="#222" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="395" y="38" font-size="26" font-weight="700">Négoce : produit sans transformation</text>
    <text x="128" y="98">Produit reçu</text><text x="395" y="98">Stockage</text><text x="662" y="98">Même produit expédié</text>
    <text x="395" y="147" font-size="26" font-weight="700">Production : transformation du produit</text>
    <text x="128" y="206">Composants reçus</text><text x="395" y="206">Assemblage</text><text x="662" y="206">Produit fini expédié</text>
  </g>
</svg>
