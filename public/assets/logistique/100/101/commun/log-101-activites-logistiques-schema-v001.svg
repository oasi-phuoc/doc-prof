<svg xmlns="http://www.w3.org/2000/svg" width="750" height="245" viewBox="0 0 750 245" role="img" aria-labelledby="titre description">
  <title id="titre">Activités logistiques anciennes et chaîne moderne</title>
  <desc id="description">Chasser, transformer et consommer sont rapprochés des étapes modernes d’approvisionnement, de production et de distribution. La distribution achemine le produit vers son utilisateur.</desc>
  <rect width="750" height="245" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="15" y="47" width="222" height="48" rx="5"/>
    <rect x="264" y="47" width="222" height="48" rx="5"/>
    <rect x="513" y="47" width="222" height="48" rx="5"/>
    <path d="M242 71h17m-6-6 6 6-6 6m238-6h17m-6-6 6 6-6 6"/>
    <rect x="15" y="158" width="222" height="48" rx="5"/>
    <rect x="264" y="158" width="222" height="48" rx="5"/>
    <rect x="513" y="158" width="222" height="48" rx="5"/>
    <path d="M242 182h17m-6-6 6 6-6 6m238-6h17m-6-6 6 6-6 6"/>
  </g>
  <g fill="#222" font-family="sans-serif" font-size="23" text-anchor="middle">
    <text x="375" y="32" font-weight="700">Exemple dans une société ancienne</text>
    <text x="126" y="79">Chasser</text>
    <text x="375" y="79">Transformer</text>
    <text x="624" y="79">Consommer</text>
    <text x="375" y="142" font-weight="700">Chaîne logistique simplifiée aujourd’hui</text>
    <text x="126" y="190">Approvisionnement</text>
    <text x="375" y="190">Production</text>
    <text x="624" y="190">Distribution</text>
    <text x="375" y="231" font-size="18">La distribution met le produit à disposition de son utilisateur.</text>
  </g>
</svg>
