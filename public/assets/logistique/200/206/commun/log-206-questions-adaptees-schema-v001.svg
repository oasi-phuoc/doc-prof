<svg xmlns="http://www.w3.org/2000/svg" width="800" height="183" viewBox="0 0 800 183" role="img" aria-labelledby="titre desc">
  <title id="titre">Deux façons de questionner</title>
  <desc id="desc">Question ouverte — Quel incident a retardé la tournée ?. Question fermée — Le départ est-il confirmé pour 14 h ?.</desc>
  <rect width="800" height="183" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Deux façons de questionner</text>
    <rect x="20" y="51" width="367" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="203.5" y="76" font-size="17" fill="#4a4a4a">A</text>
    <text x="203.5" y="105" font-size="18" font-weight="bold">Question ouverte</text>
    <text x="203.5" y="125" font-size="15">Quel incident a retardé la</text>
    <text x="203.5" y="141" font-size="15">tournée ?</text>
    <rect x="413" y="51" width="367" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="596.5" y="76" font-size="17" fill="#4a4a4a">B</text>
    <text x="596.5" y="105" font-size="18" font-weight="bold">Question fermée</text>
    <text x="596.5" y="125" font-size="15">Le départ est-il confirmé pour</text>
    <text x="596.5" y="141" font-size="15">14 h ?</text>
  </g>
</svg>
