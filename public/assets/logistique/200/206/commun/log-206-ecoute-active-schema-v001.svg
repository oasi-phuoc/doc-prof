<svg xmlns="http://www.w3.org/2000/svg" width="800" height="183" viewBox="0 0 800 183" role="img" aria-labelledby="titre desc">
  <title id="titre">Écouter, clarifier et confirmer</title>
  <desc id="desc">1. Encourager — Laisser exposer la demande. 2. Clarifier — Reformuler les points utiles. 3. Confirmer — Résumer et fixer la suite.</desc>
  <rect width="800" height="183" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Écouter, clarifier et confirmer</text>
    <rect x="20" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="138" y="76" font-size="17" fill="#4a4a4a">1</text>
    <text x="138" y="105" font-size="18" font-weight="bold">Encourager</text>
    <text x="138" y="125" font-size="15">Laisser exposer la</text>
    <text x="138" y="141" font-size="15">demande</text>
    <path d="M261 111h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="282" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="400" y="76" font-size="17" fill="#4a4a4a">2</text>
    <text x="400" y="105" font-size="18" font-weight="bold">Clarifier</text>
    <text x="400" y="125" font-size="15">Reformuler les points</text>
    <text x="400" y="141" font-size="15">utiles</text>
    <path d="M523 111h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="544" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="662" y="76" font-size="17" fill="#4a4a4a">3</text>
    <text x="662" y="105" font-size="18" font-weight="bold">Confirmer</text>
    <text x="662" y="125" font-size="15">Résumer et fixer la suite</text>
  </g>
</svg>
