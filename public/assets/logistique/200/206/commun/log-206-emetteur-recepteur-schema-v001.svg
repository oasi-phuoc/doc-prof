<svg xmlns="http://www.w3.org/2000/svg" width="800" height="177" viewBox="0 0 800 177" role="img" aria-labelledby="titre desc">
  <title id="titre">Transmission et retour de confirmation</title>
  <desc id="desc">L’accueil transmet le quai 13 par radio. Le chauffeur répète le quai et la référence dans l’autre sens.</desc>
  <rect width="800" height="177" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Transmission et retour de confirmation</text>
    <rect x="20" y="73" width="174" height="79" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <rect x="606" y="73" width="174" height="79" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <path d="M208 90h384m-7-7 7 7-7 7M592 136H208m7-7-7 7 7 7" fill="none" stroke="#333" stroke-width="2.5"/>
    <text x="107" y="109" font-size="20" font-weight="bold">Accueil</text>
    <text x="107" y="132" font-size="16">Émetteur</text>
    <text x="693" y="109" font-size="20" font-weight="bold">Chauffeur</text>
    <text x="693" y="132" font-size="16">Récepteur</text>
    <text x="400" y="74" font-size="17">Radio : rendez-vous au quai 13</text>
    <text x="400" y="159" font-size="17">Retour : je confirme le quai 13</text>
  </g>
</svg>
