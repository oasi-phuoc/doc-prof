<svg xmlns="http://www.w3.org/2000/svg" width="800" height="234" viewBox="0 0 800 234" role="img" aria-labelledby="titre desc">
  <title id="titre">Le nombre d’acteurs structure le marché</title>
  <desc id="desc">Un acheteur, Un vendeur — Monopole bilatéral. Un vendeur et un acheteur. Un acheteur, Beaucoup de vendeurs — Monopsone. Un demandeur face aux vendeurs. Beaucoup d’acheteurs, Un vendeur — Monopole. Un vendeur face aux acheteurs. Beaucoup d’acheteurs, Beaucoup de vendeurs — Polypole. Beaucoup d’acteurs des deux côtés.</desc>
  <rect width="800" height="234" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Le nombre d’acteurs structure le marché</text>
    <path d="M20 55H780V223H20ZM20 109H780M20 166H780M211 55V223M496 55V223" fill="none" stroke="#333" stroke-width="2"/>
    <text x="355" y="88" font-size="18" font-weight="bold">Un vendeur</text>
    <text x="635" y="88" font-size="18" font-weight="bold">Beaucoup de vendeurs</text>
    <text x="115" y="140" font-size="16" font-weight="bold">Un acheteur</text>
    <text x="355" y="134" font-size="17" font-weight="bold">Monopole bilatéral</text>
    <text x="355" y="155" font-size="14">Un vendeur et un acheteur</text>
    <text x="635" y="134" font-size="17" font-weight="bold">Monopsone</text>
    <text x="635" y="155" font-size="14">Un demandeur face aux vendeurs</text>
    <text x="115" y="197" font-size="16" font-weight="bold">Beaucoup d’acheteurs</text>
    <text x="355" y="191" font-size="17" font-weight="bold">Monopole</text>
    <text x="355" y="212" font-size="14">Un vendeur face aux acheteurs</text>
    <text x="635" y="191" font-size="17" font-weight="bold">Polypole</text>
    <text x="635" y="212" font-size="14">Beaucoup d’acteurs des deux côtés</text>
  </g>
</svg>
