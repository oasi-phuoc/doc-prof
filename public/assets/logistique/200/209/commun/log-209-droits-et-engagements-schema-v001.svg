<svg xmlns="http://www.w3.org/2000/svg" width="800" height="183" viewBox="0 0 800 183" role="img" aria-labelledby="titre desc">
  <title id="titre">Trois bases possibles pour une réponse</title>
  <desc id="desc">Droits liés au défaut — Vente et règles légales. Garantie commerciale — Engagement et conditions. Geste commercial — Décision autorisée.</desc>
  <rect width="800" height="183" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Trois bases possibles pour une réponse</text>
    <rect x="20" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="138" y="76" font-size="17" fill="#4a4a4a">A</text>
    <text x="138" y="105" font-size="18" font-weight="bold">Droits liés au défaut</text>
    <text x="138" y="125" font-size="15">Vente et règles légales</text>
    <rect x="282" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="400" y="76" font-size="17" fill="#4a4a4a">B</text>
    <text x="400" y="105" font-size="18" font-weight="bold">Garantie commerciale</text>
    <text x="400" y="125" font-size="15">Engagement et conditions</text>
    <rect x="544" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="662" y="76" font-size="17" fill="#4a4a4a">C</text>
    <text x="662" y="105" font-size="18" font-weight="bold">Geste commercial</text>
    <text x="662" y="125" font-size="15">Décision autorisée</text>
  </g>
</svg>
