<svg xmlns="http://www.w3.org/2000/svg" width="800" height="183" viewBox="0 0 800 183" role="img" aria-labelledby="titre desc">
  <title id="titre">Le modèle AIDA illustré</title>
  <desc id="desc">1. Attention — Titre de l’annonce. 2. Intérêt — Usage de la caisse. 3. Désir — Avantage expliqué. 4. Action — Demander une offre.</desc>
  <rect width="800" height="183" fill="white"/>
