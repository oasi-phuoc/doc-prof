    <text x="105.25" y="76" font-size="17" fill="#4a4a4a">1</text>
    <text x="105.25" y="105" font-size="18" font-weight="bold">Attention</text>
    <text x="105.25" y="125" font-size="15">Titre de l’annonce</text>
    <path d="M195.5 111h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="216.5" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="301.75" y="76" font-size="17" fill="#4a4a4a">2</text>
    <text x="301.75" y="105" font-size="18" font-weight="bold">Intérêt</text>
    <text x="301.75" y="125" font-size="15">Usage de la caisse</text>
    <path d="M392 111h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="413" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="498.25" y="76" font-size="17" fill="#4a4a4a">3</text>
    <text x="498.25" y="105" font-size="18" font-weight="bold">Désir</text>
    <text x="498.25" y="125" font-size="15">Avantage expliqué</text>
    <path d="M588.5 111h16m-5-5 5 5-5 5" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="609.5" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="694.75" y="76" font-size="17" fill="#4a4a4a">4</text>
