<svg xmlns="http://www.w3.org/2000/svg" width="800" height="183" viewBox="0 0 800 183" role="img" aria-labelledby="titre desc">
  <title id="titre">Les quatre P appliqués à la vente de caisses</title>
  <desc id="desc">Produit — Caisse réutilisable. Prix — Montant et consigne. Distribution — Retrait au dépôt. Communication — Fiche de l’offre.</desc>
  <rect width="800" height="183" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Les quatre P appliqués à la vente de caisses</text>
    <rect x="20" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="105.25" y="76" font-size="17" fill="#4a4a4a">A</text>
    <text x="105.25" y="105" font-size="18" font-weight="bold">Produit</text>
    <text x="105.25" y="125" font-size="15">Caisse réutilisable</text>
    <rect x="216.5" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="301.75" y="76" font-size="17" fill="#4a4a4a">B</text>
    <text x="301.75" y="105" font-size="18" font-weight="bold">Prix</text>
    <text x="301.75" y="125" font-size="15">Montant et consigne</text>
    <rect x="413" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="498.25" y="76" font-size="17" fill="#4a4a4a">C</text>
    <text x="498.25" y="105" font-size="18" font-weight="bold">Distribution</text>
    <text x="498.25" y="125" font-size="15">Retrait au dépôt</text>
    <rect x="609.5" y="51" width="170.5" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="694.75" y="76" font-size="17" fill="#4a4a4a">D</text>
    <text x="694.75" y="105" font-size="18" font-weight="bold">Communication</text>
    <text x="694.75" y="125" font-size="15">Fiche de l’offre</text>
  </g>
</svg>
