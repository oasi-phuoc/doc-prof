<svg xmlns="http://www.w3.org/2000/svg" width="800" height="232" viewBox="0 0 800 232" role="img" aria-labelledby="titre desc">
  <title id="titre">Prix et quantités dans un marché simplifié</title>
  <desc id="desc">Le prix est sur l’axe vertical. La quantité est sur l’axe horizontal. La courbe d’offre monte et la courbe de demande descend. Leur intersection indique l’équilibre.</desc>
  <rect width="800" height="232" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Prix et quantités dans un marché simplifié</text>
    <path d="M132 194V53m-6 6 6-6 6 6M132 194H694m-6-6 6 6-6 6" fill="none" stroke="#333" stroke-width="2.5"/>
    <path d="M171 173L646 68" stroke="#222" fill="none" stroke-width="3"/>
    <path d="M171 67L646 177" stroke="#444" fill="none" stroke-width="3" stroke-dasharray="10 6"/>
    <path d="M132 121h274v73" stroke="#555" fill="none" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="406" cy="121" r="5" fill="#222"/>
    <text x="98" y="65" font-size="17">Prix</text>
    <text x="675" y="220" font-size="17">Quantité</text>
    <text x="677" y="68" font-size="18">Offre</text>
    <text x="685" y="174" font-size="18">Demande</text>
    <text x="476" y="112" font-size="17">Équilibre</text>
  </g>
</svg>
