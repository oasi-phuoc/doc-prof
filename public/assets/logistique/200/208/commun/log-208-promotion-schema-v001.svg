<svg xmlns="http://www.w3.org/2000/svg" width="800" height="183" viewBox="0 0 800 183" role="img" aria-labelledby="titre desc">
  <title id="titre">Les conditions d’une promotion</title>
  <desc id="desc">Article — Référence et quantité. Durée — Dates et stock disponible. Prix — Règles et cumul.</desc>
  <rect width="800" height="183" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">Les conditions d’une promotion</text>
    <rect x="20" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="138" y="76" font-size="17" fill="#4a4a4a">A</text>
    <text x="138" y="105" font-size="18" font-weight="bold">Article</text>
    <text x="138" y="125" font-size="15">Référence et quantité</text>
    <rect x="282" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="400" y="76" font-size="17" fill="#4a4a4a">B</text>
    <text x="400" y="105" font-size="18" font-weight="bold">Durée</text>
    <text x="400" y="125" font-size="15">Dates et stock disponible</text>
    <rect x="544" y="51" width="236" height="118" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <text x="662" y="76" font-size="17" fill="#4a4a4a">C</text>
    <text x="662" y="105" font-size="18" font-weight="bold">Prix</text>
    <text x="662" y="125" font-size="15">Règles et cumul</text>
  </g>
</svg>
