<svg xmlns="http://www.w3.org/2000/svg" width="800" height="234" viewBox="0 0 800 234" role="img" aria-labelledby="titre desc">
  <title id="titre">La fenêtre de Johari</title>
  <desc id="desc">Connu des autres, Connu de soi — Zone ouverte. Travail observé et reconnu. Connu des autres, Inconnu de soi — Zone aveugle. Habitude remarquée par l’équipe. Inconnu des autres, Connu de soi — Zone privée. Information gardée pour soi. Inconnu des autres, Inconnu de soi — Zone inconnue. Aspect encore inaperçu.</desc>
  <rect width="800" height="234" fill="white"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="400" y="30" font-size="24" font-weight="bold">La fenêtre de Johari</text>
    <path d="M20 55H780V223H20ZM20 109H780M20 166H780M211 55V223M496 55V223" fill="none" stroke="#333" stroke-width="2"/>
    <text x="355" y="88" font-size="18" font-weight="bold">Connu de soi</text>
    <text x="635" y="88" font-size="18" font-weight="bold">Inconnu de soi</text>
    <text x="115" y="140" font-size="16" font-weight="bold">Connu des autres</text>
    <text x="355" y="134" font-size="17" font-weight="bold">Zone ouverte</text>
    <text x="355" y="155" font-size="14">Travail observé et reconnu</text>
    <text x="635" y="134" font-size="17" font-weight="bold">Zone aveugle</text>
    <text x="635" y="155" font-size="14">Habitude remarquée par l’équipe</text>
    <text x="115" y="197" font-size="16" font-weight="bold">Inconnu des autres</text>
    <text x="355" y="191" font-size="17" font-weight="bold">Zone privée</text>
    <text x="355" y="212" font-size="14">Information gardée pour soi</text>
    <text x="635" y="191" font-size="17" font-weight="bold">Zone inconnue</text>
    <text x="635" y="212" font-size="14">Aspect encore inaperçu</text>
  </g>
</svg>
