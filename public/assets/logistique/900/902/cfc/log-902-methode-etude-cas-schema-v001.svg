<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-labelledby="titre description">
  <title id="titre">Une démarche pour une étude de cas logistique</title>
  <desc id="description">Lisez les données, calculez les écarts ou comparez les options, décidez en justifiant avec les contraintes, puis tracez le résultat et le prochain contrôle.</desc>
  <rect width="800" height="210" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="10" y="56" width="176" height="103" rx="5"/>
    <rect x="211" y="56" width="176" height="103" rx="5"/>
    <rect x="413" y="56" width="176" height="103" rx="5"/>
    <rect x="614" y="56" width="176" height="103" rx="5"/>
    <path d="M191 105h15m-6-6 6 6-6 6m192-6h15m-6-6 6 6-6 6m193-6h15m-6-6 6 6-6 6"/>
  </g>
  <g fill="#222" font-family="sans-serif" text-anchor="middle">
    <text x="400" y="32" font-size="26" font-weight="700">Les quatre étapes d’une étude de cas</text>
    <text x="98" y="89" font-size="22" font-weight="700">1. Lire</text>
    <text x="299" y="89" font-size="22" font-weight="700">2. Calculer</text>
    <text x="501" y="89" font-size="22" font-weight="700">3. Décider</text>
    <text x="702" y="89" font-size="22" font-weight="700">4. Tracer</text>
    <text x="98" y="127" font-size="17">Données et unités</text>
    <text x="299" y="127" font-size="17">Écarts et options</text>
    <text x="501" y="127" font-size="17">Critères et raison</text>
    <text x="702" y="127" font-size="17">Preuve et contrôle</text>
    <text x="400" y="190" font-size="19">Une décision motivée relie un chiffre, une contrainte et une action.</text>
  </g>
</svg>
