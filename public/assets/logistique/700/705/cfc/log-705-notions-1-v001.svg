<svg xmlns="http://www.w3.org/2000/svg" width="800" height="188" viewBox="0 0 800 188" role="img" aria-labelledby="titre info">
  <title id="titre">Lire le ratio des coûts</title>
  <desc id="info">Sous 100 %. Le revenu couvre les coûts. À 100 %. Le résultat est nul. Au-dessus de 100 %. Les coûts dépassent le revenu.</desc>
  <rect width="800" height="188" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <text x="400" y="30" font-size="25" font-weight="bold">Lire le ratio des coûts</text>
    <rect x="26" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="141.333" y="78" font-size="16">A</text>
    <text x="141.333" y="105" font-size="19" font-weight="bold">Sous 100 %</text>
    <text x="141.333" y="128" font-size="16">Le revenu couvre les</text>
    <text x="141.333" y="144" font-size="16">coûts</text>
    <rect x="284.667" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="400" y="78" font-size="16">B</text>
    <text x="400" y="105" font-size="19" font-weight="bold">À 100 %</text>
    <text x="400" y="128" font-size="16">Le résultat est nul</text>
    <rect x="543.333" y="50" width="230.667" height="119" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
    <text x="658.667" y="78" font-size="16">C</text>
    <text x="658.667" y="105" font-size="19" font-weight="bold">Au-dessus de 100 %</text>
    <text x="658.667" y="128" font-size="16">Les coûts dépassent le</text>
    <text x="658.667" y="144" font-size="16">revenu</text>
  </g>
</svg>
